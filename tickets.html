<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子機票／簽證查詢 E-Tickets &amp; Visa｜Tainan City FC</title>
<meta name="theme-color" content="#170410">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">返回首頁 / Home</a>

  <div id="listView">
    <div class="page-title">電子機票／簽證查詢<br>E-Tickets &amp; Visa</div>
    <div class="page-sub">點選你的姓名，查看個人機票與簽證<br>Tap your name to view your e-ticket and visa</div>

    <input type="text" class="search-box" id="searchBox" placeholder="輸入姓名搜尋 / Search name…">
    <div class="roster-list" id="rosterList"></div>
  </div>

  <div id="ticketView" style="display:none;">
    <div class="ticket-panel">
      <div class="role" id="tRole"></div>
      <div class="name" id="tName"></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h2>🎫 電子機票 E-Ticket</h2>
      <div id="tTicketActions"></div>
    </div>

    <div class="card">
      <h2>🛂 簽證 Visa</h2>
      <div id="tVisaActions"></div>
    </div>

    <p style="text-align:center; margin-top:4px;">
      <a href="#" class="back-link" onclick="showList(); return false;">返回名單 / Back to list</a>
    </p>
  </div>

  <div class="footer-note">Peggy整理｜2026-09-20</div>
</div>

<script src="roster.js"></script>
<script>
function renderList(filter) {
  const wrap = document.getElementById('rosterList');
  wrap.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  ROSTER.forEach((p, idx) => {
    if (f && !p.name.toLowerCase().includes(f)) return;
    const div = document.createElement('div');
    div.className = 'roster-item' + (p.slug ? '' : ' missing');
    const ticketMark = p.slug ? '🎫' : '';
    const visaMark = p.visa_slug ? '🛂' : '';
    div.innerHTML = `
      <div>
        <div class="role">${p.role} / ${p.role_en}</div>
        <div class="name">${p.name} <span style="font-size:16px;">${ticketMark} ${visaMark}</span></div>
      </div>
      <div class="arrow">›</div>
    `;
    div.onclick = () => openTicket(idx);
    wrap.appendChild(div);
  });
}

function openTicket(idx) {
  const p = ROSTER[idx];
  document.getElementById('tRole').textContent = p.role + ' / ' + p.role_en;
  document.getElementById('tName').textContent = p.name;

  const ticketActions = document.getElementById('tTicketActions');
  if (p.slug) {
    ticketActions.innerHTML = `
      <a class="btn btn-primary" href="tickets/${p.slug}.pdf" target="_blank" rel="noopener">開啟電子機票 PDF<br><span style="font-size:16px;font-weight:400;">Open Ticket PDF</span></a>
      <a class="btn btn-secondary" href="tickets/${p.slug}.pdf" download>下載到手機<br><span style="font-size:15px;font-weight:400;color:var(--text-dim);">Download</span></a>
    `;
  } else {
    ticketActions.innerHTML = `<div class="no-ticket-note">目前尚未收到你的電子機票，請聯繫領隊。<br>Your e-ticket has not been received yet. Please contact the team manager.</div>`;
  }

  const visaActions = document.getElementById('tVisaActions');
  if (p.visa_slug) {
    visaActions.innerHTML = `
      <a class="btn btn-primary" href="visas/${p.visa_slug}.pdf" target="_blank" rel="noopener">開啟簽證 PDF<br><span style="font-size:16px;font-weight:400;">Open Visa PDF</span></a>
      <a class="btn btn-secondary" href="visas/${p.visa_slug}.pdf" download>下載到手機<br><span style="font-size:15px;font-weight:400;color:var(--text-dim);">Download</span></a>
    `;
  } else {
    visaActions.innerHTML = `<div class="no-ticket-note">目前尚未收到你的簽證，請聯繫領隊。<br>Your visa has not been received yet. Please contact the team manager.</div>`;
  }

  document.getElementById('listView').style.display = 'none';
  document.getElementById('ticketView').style.display = 'block';
  window.scrollTo(0,0);
}

function showList() {
  document.getElementById('ticketView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
}

document.getElementById('searchBox').addEventListener('input', (e) => renderList(e.target.value));
renderList('');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
