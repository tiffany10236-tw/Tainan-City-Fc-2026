<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子機票查詢｜Tainan City FC</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">返回首頁</a>

  <div id="listView">
    <div class="page-title">電子機票查詢</div>
    <div class="page-sub">點選你的姓名，查看個人電子機票</div>

    <input type="text" class="search-box" id="searchBox" placeholder="輸入姓名搜尋…">
    <div class="roster-list" id="rosterList"></div>
  </div>

  <div id="ticketView" style="display:none;">
    <div class="ticket-panel">
      <div class="role" id="tRole"></div>
      <div class="name" id="tName"></div>
      <div id="tActions"></div>
    </div>
    <p style="text-align:center; margin-top:16px;">
      <a href="#" class="back-link" onclick="showList(); return false;">返回名單</a>
    </p>
  </div>

  <div class="footer-note">Peggy整理｜2026-09-19</div>
</div>

<script src="roster.js"></script>
<script>
function renderList(filter) {
  const wrap = document.getElementById('rosterList');
  wrap.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  ROSTER.forEach((p, idx) => {
    if (f && !p.name.toLowerCase().includes(f)) return;
    const div = document.createElement('div');
    div.className = 'roster-item' + (p.slug ? '' : ' missing');
    div.innerHTML = `
      <div>
        <div class="role">${p.role}</div>
        <div class="name">${p.name}</div>
      </div>
      <div class="arrow">${p.slug ? '›' : '尚無機票'}</div>
    `;
    div.onclick = () => openTicket(idx);
    wrap.appendChild(div);
  });
}

function openTicket(idx) {
  const p = ROSTER[idx];
  document.getElementById('tRole').textContent = p.role;
  document.getElementById('tName').textContent = p.name;
  const actions = document.getElementById('tActions');
  if (p.slug) {
    actions.innerHTML = `
      <a class="btn btn-primary" href="tickets/${p.slug}.pdf" target="_blank" rel="noopener">開啟電子機票 PDF</a>
      <a class="btn btn-secondary" href="tickets/${p.slug}.pdf" download>下載到手機</a>
    `;
  } else {
    actions.innerHTML = `<div class="no-ticket-note">目前尚未收到你的電子機票，請聯繫領隊。</div>`;
  }
  document.getElementById('listView').style.display = 'none';
  document.getElementById('ticketView').style.display = 'block';
  window.scrollTo(0,0);
}

function showList() {
  document.getElementById('ticketView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
}

document.getElementById('searchBox').addEventListener('input', (e) => renderList(e.target.value));
renderList('');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
